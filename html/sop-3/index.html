<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Traveller Information Form" />

    <meta name="author" content="Student Name" />

    <title>Traveller Form</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>Traveller Information</h1>

      <form action="page2.html">
        <label>Name of Traveller</label>

        <input type="text" placeholder="Enter Name" required />

        <label>Date of Travel</label>

        <input type="date" required />

        <label>Telephone Number</label>

        <input type="tel" placeholder="Enter Mobile Number" required />

        <br /><br />

        <input
          type="image"
          src="../assets/submit-button.png"
          alt="Submit"
          width="120"
        />
      </form>

      <br />

      <a href="page2.html"> View Transport Details </a>
    </div>
  </body>
</html>
