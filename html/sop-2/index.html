<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tourist Places</title>

    <style>
      body {
        margin: 40px;
        font-family: "Times New Roman", serif;
        display: flex;
        justify-content: center;
      }

      table {
        width: 500px;
        border-collapse: collapse;
        border: 2px solid black;
      }

      th,
      td {
        border: 1px solid black;
      }

      th {
        background: #cfeef7;
        color: #9b2d5d;
        font-size: 28px;
        padding: 25px;
      }

      .left {
        width: 45%;
        background: white;
        vertical-align: top;
        padding: 10px;
        font-size: 18px;
      }

      .right {
        width: 55%;
        background: #efd0dc;
        vertical-align: top;
        padding: 10px;
        font-size: 18px;
      }

      h3 {
        margin: 0 0 10px 0;
        font-size: 18px;
        font-weight: normal;
      }

      ol {
        margin-top: 5px;
        padding-left: 28px;
      }

      ul {
        margin-top: 5px;
        padding-left: 22px;
      }
    </style>
  </head>

  <body>
    <table>
      <tr>
        <th colspan="2" style="background: #cfeef7">Tourist places</th>
      </tr>

      <tr>
        <td class="left">
          <h3><b>City</b></h3>

          <ol>
            <li>Pune</li>

            <li>Banglore</li>

            <li>Hyderabad</li>

            <li>Delhi</li>
          </ol>
        </td>

        <td class="right">
          <h3>Tourist places in Pune</h3>

          <ul>
            <li>Shanivarwada</li>

            <li>Kelkar Museum</li>

            <li>Sinhgad fort</li>
          </ul>
        </td>
      </tr>
    </table>
  </body>
</html>
